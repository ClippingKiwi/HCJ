<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Edit - Smart Image Resizer</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip CDN (압축 다운로드용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- 커스텀 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

    <!-- 1 & 2. 상단 헤더 -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
            <i data-lucide="image" class="w-6 h-6 text-blue-600"></i>
            <span class="text-xl font-bold text-gray-800">Image Edit</span>
        </div>
        <div class="text-sm font-semibold text-gray-500 bg-gray-100 px-3 py-1 rounded-full">
            Smart Image Resizer
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-6 space-y-6">

        <!-- 3. 드래그 앤 드롭 업로드 구역 -->
        <section id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-2xl p-8 bg-white text-center hover:border-blue-500 transition-colors cursor-pointer">
            <input type="file" id="file-input" multiple accept="image/*" class="hidden">
            <div class="flex flex-col items-center justify-center space-y-3">
                <div class="p-4 bg-blue-50 rounded-full text-blue-600">
                    <i data-lucide="upload-cloud" class="w-10 h-10"></i>
                </div>
                <p class="text-gray-700 font-medium text-lg">이미지 파일을 드래그 앤 드롭하거나 클릭하여 업로드하세요</p>
                <p class="text-gray-400 text-sm">PNG, JPG, WEBP 등 지원 (다중 선택 가능)</p>
                <button type="button" id="select-files-btn" class="mt-2 px-5 py-2.5 bg-blue-600 text-white font-medium text-sm rounded-lg hover:bg-blue-700 transition-colors shadow-sm">
                    파일 선택
                </button>
            </div>
        </section>

        <!-- 옵션 설정 구역 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-6">
            <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                <i data-lucide="sliders" class="w-5 h-5 text-blue-600"></i> 변환 옵션 설정
            </h2>

            <!-- 4. 캔버스 비율 선택 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">캔버스 비율</label>
                <div class="grid grid-cols-3 md:grid-cols-6 gap-2 mb-3">
                    <button type="button" class="ratio-btn px-4 py-2 text-sm border rounded-lg font-medium text-gray-700 hover:bg-gray-50 bg-blue-50 border-blue-500 text-blue-600" data-ratio="1:1">1:1</button>
                    <button type="button" class="ratio-btn px-4 py-2 text-sm border rounded-lg font-medium text-gray-700 hover:bg-gray-50" data-ratio="3:4">3:4</button>
                    <button type="button" class="ratio-btn px-4 py-2 text-sm border rounded-lg font-medium text-gray-700 hover:bg-gray-50" data-ratio="4:3">4:3</button>
                    <button type="button" class="ratio-btn px-4 py-2 text-sm border rounded-lg font-medium text-gray-700 hover:bg-gray-50" data-ratio="9:16">9:16</button>
                    <button type="button" class="ratio-btn px-4 py-2 text-sm border rounded-lg font-medium text-gray-700 hover:bg-gray-50" data-ratio="16:9">16:9</button>
                    <button type="button" class="ratio-btn px-4 py-2 text-sm border rounded-lg font-medium text-gray-700 hover:bg-gray-50" data-ratio="custom">커스텀</button>
                </div>

                <!-- 커스텀 입력창 -->
                <div id="custom-ratio-container" class="hidden flex items-center space-x-2 mt-2 bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <input type="number" id="custom-w" placeholder="너비 비율" value="1080" class="w-28 px-3 py-1.5 border rounded-md text-sm">
                    <span class="text-gray-500">:</span>
                    <input type="number" id="custom-h" placeholder="높이 비율" value="1080" class="w-28 px-3 py-1.5 border rounded-md text-sm">
                    <span class="text-xs text-gray-400 pl-2">픽셀(px) 또는 정수 비율 입력</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-gray-100">
                <!-- 5. Padding vs Crop 선택 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">조정 방식</label>
                    <div class="flex space-x-4">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="mode" value="padding" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="text-sm text-gray-700 font-medium">Padding (여백 추가)</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="mode" value="crop" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="text-sm text-gray-700 font-medium">Crop (자르기)</span>
                        </label>
                    </div>
                </div>

                <!-- 6. Padding 색상 지정 -->
                <div id="padding-color-container" class="flex items-center space-x-3">
                    <label class="block text-sm font-semibold text-gray-700">여백 색상:</label>
                    <input type="color" id="bg-color" value="#ffffff" class="w-9 h-9 border border-gray-300 rounded cursor-pointer">
                    <span id="color-code" class="text-xs font-mono text-gray-500">#FFFFFF</span>
                </div>
            </div>
        </section>

        <!-- 8~11. 이미지 목록 및 작업 진행 현황 구역 -->
        <section id="process-section" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4 hidden">
            <div class="flex justify-between items-center border-b border-gray-100 pb-4">
                <h3 class="font-bold text-gray-800 text-lg flex items-center gap-2">
                    <i data-lucide="list" class="w-5 h-5 text-blue-600"></i> 변환 목록
                </h3>
                <!-- 11. 일괄 다운로드 버튼 -->
                <button id="download-all-btn" disabled class="px-4 py-2 bg-emerald-600 text-white font-medium text-sm rounded-lg opacity-50 cursor-not-allowed hover:bg-emerald-700 transition-colors flex items-center gap-2 shadow-sm">
                    <i data-lucide="archive" class="w-4 h-4"></i> 전체 다운로드 (ZIP)
                </button>
            </div>

            <!-- 8, 9, 10. 이미지 썸네일, 프로그레스 바, 개별 다운로드 버튼 목록 -->
            <div id="image-list" class="space-y-4"></div>
        </section>

    </main>

    <!-- 스크립트 연결 -->
    <script src="script.js"></script>
</body>
</html>
