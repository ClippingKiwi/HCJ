<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI 계산기 · MINI APPS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap narrow">
    <a class="back-link" href="index.html">← 메인으로</a>

    <header class="page-head">
      <span class="page-icon">⚖️</span>
      <h1>BMI 계산기</h1>
      <p>키·몸무게·성별을 입력하면 BMI와 표준체중 대비 목표 체중을 계산합니다.</p>
    </header>

    <section class="panel">
      <form id="bmiForm" novalidate>
        <div class="field">
          <label>성별</label>
          <div class="radio-row">
            <label class="radio"><input type="radio" name="gender" value="male" checked /><span>남성</span></label>
            <label class="radio"><input type="radio" name="gender" value="female" /><span>여성</span></label>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="height">키 (cm)</label>
            <input type="number" id="height" inputmode="decimal" step="0.1" min="100" max="250" placeholder="예: 172.5" />
          </div>
          <div class="field">
            <label for="weight">몸무게 (kg)</label>
            <input type="number" id="weight" inputmode="decimal" step="0.1" min="20" max="300" placeholder="예: 68.0" />
          </div>
        </div>

        <p class="error" id="errorMsg" hidden></p>
        <button type="submit" class="primary-btn">BMI 계산하기</button>
      </form>
    </section>

    <section id="resultArea" hidden>
      <div class="panel result-panel">
        <div class="bmi-core">
          <span class="bmi-label">나의 BMI</span>
          <div class="bmi-value" id="bmiValue">0.0</div>
          <div class="bmi-status" id="bmiStatus">-</div>
          <p class="bmi-desc" id="bmiDesc"></p>
        </div>

        <div class="gauge">
          <div class="gauge-bar">
            <span class="seg seg-under"></span>
            <span class="seg seg-normal"></span>
            <span class="seg seg-over"></span>
            <span class="seg seg-obese"></span>
            <span class="seg seg-severe"></span>
            <i class="gauge-pin" id="gaugePin"></i>
          </div>
          <div class="gauge-scale"><span>18.5</span><span>23</span><span>25</span><span>30</span></div>
          <div class="gauge-legend">
            <span><i class="dot c-under"></i>저체중</span>
            <span><i class="dot c-normal"></i>정상</span>
            <span><i class="dot c-over"></i>과체중</span>
            <span><i class="dot c-obese"></i>비만</span>
            <span><i class="dot c-severe"></i>고도비만</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3 class="panel-title">표준체중 대비 목표 체중 (90% / 100% / 110%)</h3>
        <p class="hint" id="stdInfo" style="margin-bottom:14px"></p>
        <div class="target-list" id="targetList"></div>
        <p class="hint" style="margin-top:14px">
          ※ 표준체중은 남성 키(m)²×22, 여성 키(m)²×21 기준입니다. 의학적 진단이 아닌 참고용 수치입니다.
        </p>
      </div>
    </section>
  </main>

  <script src="bmi.js"></script>
</body>
</html>
