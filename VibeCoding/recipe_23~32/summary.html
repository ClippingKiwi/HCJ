<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문서 요약기 · MINI APPS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap narrow">
    <a class="back-link" href="index.html">← 메인으로</a>

    <header class="page-head">
      <span class="page-icon">✍️</span>
      <h1>문서 요약기</h1>
      <p>TextRank 알고리즘으로 문서의 핵심 문장만 골라냅니다. 파일은 서버로 전송되지 않습니다.</p>
    </header>

    <!-- 업로드 -->
    <section class="panel">
      <label class="up-zone" id="upZone" for="fileInput">
        <span class="up-icon">📄</span>
        <strong class="up-title">파일을 여기에 놓거나 클릭해서 선택</strong>
        <span class="up-sub">PDF · DOCX · TXT · MD (최대 20MB)</span>
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md" hidden />
      </label>

      <div class="file-meta" id="fileMeta" hidden>
        <span class="file-name" id="fileName">-</span>
        <span class="file-size" id="fileSize">-</span>
        <button type="button" class="chip-x lg" id="resetBtn" aria-label="파일 제거">✕</button>
      </div>

      <div class="bar-wrap" id="loadWrap" hidden>
        <div class="bar"><i id="loadBar"></i></div>
        <p class="hint" id="loadMsg">텍스트를 추출하는 중…</p>
      </div>

      <p class="error" id="errorMsg" hidden></p>
    </section>

    <!-- 요약 옵션 -->
    <section class="panel" id="optPanel" hidden>
      <h3 class="panel-title">요약 분량</h3>

      <div class="range-row">
        <input type="range" id="lenRange" class="range-input" min="1" max="5" step="1" value="3" />
        <output class="range-out" id="lenOut">3문장</output>
      </div>
      <div class="range-ticks">
        <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
      </div>

      <div class="tool-row">
        <span class="hint" id="docStat">-</span>
        <div class="btn-group">
          <button type="button" class="ghost-btn" id="copyBtn">복사</button>
          <button type="button" class="ghost-btn" id="saveBtn">TXT 저장</button>
        </div>
      </div>
    </section>

    <!-- 결과 -->
    <section class="panel" id="resultPanel" hidden>
      <h3 class="panel-title">📌 요약 결과</h3>
      <ol class="sum-list" id="sumList"></ol>

      <h3 class="panel-title mt">🔑 핵심 키워드</h3>
      <ul class="kw-chips" id="kwChips"></ul>

      <details class="raw-box">
        <summary>추출된 원문 보기</summary>
        <p class="raw-text" id="rawText"></p>
      </details>
    </section>
  </main>

  <!-- 외부 라이브러리 (텍스트 추출용) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="summary.js"></script>
</body>
</html>
